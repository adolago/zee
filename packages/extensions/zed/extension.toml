id = "zee"
name = "Zee"
description = "AI-powered development agent"
version = "1.0.0"
schema_version = 1
authors = ["Adolago"]
repository = "https://github.com/adolago/zee"

[agent_servers.zee]
name = "Zee"
icon = "./icons/zee.svg"

[agent_servers.zee.targets.linux-aarch64]
archive = "https://github.com/adolago/zee/releases/download/v1.0.0/zee-linux-arm64.tar.gz"
cmd = "./zee"
args = ["acp"]

[agent_servers.zee.targets.linux-x86_64]
archive = "https://github.com/adolago/zee/releases/download/v1.0.0/zee-linux-x64.tar.gz"
cmd = "./zee"
args = ["acp"]

[agent_servers.zee.targets.windows-x86_64]
archive = "https://github.com/adolago/zee/releases/download/v1.0.0/zee-windows-x64.zip"
cmd = "./zee.exe"
args = ["acp"]
