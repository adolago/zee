name: nightly

on:
  schedule:
    # Run at 2 AM UTC every day
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish-linux-nightly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Compute nightly version
        id: version
        run: |
          cd packages/agent-core
          VERSION=$(AGENT_CORE_CHANNEL=nightly bun -e 'import { Script } from "./src/pkg/script/index.ts"; console.log(Script.version)')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Nightly version: ${VERSION}"

      - name: Check npm for existing version
        id: npm
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKG="@adolago/agent-core-linux"
          if npm view "${PKG}@${VERSION}" version >/dev/null 2>&1; then
            echo "already_published=true" >> $GITHUB_OUTPUT
            echo "Already published: ${PKG}@${VERSION}"
          else
            echo "already_published=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm (linux-x64)
        if: steps.npm.outputs.already_published != 'true'
        run: |
          cd packages/agent-core
          AGENT_CORE_CHANNEL=nightly \
          AGENT_CORE_PUBLISH_PREVIEW=1 \
          AGENT_CORE_NPM_PACKAGE=@adolago/agent-core-linux \
          AGENT_CORE_WRAPPER_OS=linux \
          AGENT_CORE_WRAPPER_CPU=x64 \
          AGENT_CORE_TARGETS=linux-x64 \
          bun run script/publish.ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: steps.npm.outputs.already_published != 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Generate changelog from commits
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LATEST_TAG" ]; then
            CHANGELOG=$(git log ${LATEST_TAG}..HEAD --pretty=format:"- %s" | head -20)
          else
            CHANGELOG="Initial nightly release"
          fi

          if gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub release v${VERSION} already exists"
            exit 0
          fi

          gh release create "v${VERSION}" \
            --title "Nightly ${VERSION}" \
            --notes "## Nightly Build

          **Version:** ${VERSION}
          **Date:** $(date +%Y-%m-%d)

          ### Changes
          ${CHANGELOG}

          ### Install
          \`\`\`bash
          npm install -g @adolago/agent-core-linux@nightly
          # or specific version
          npm install -g @adolago/agent-core-linux@${VERSION}
          \`\`\`
          " \
            --prerelease
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload artifacts
        if: steps.npm.outputs.already_published != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agent-core-linux-nightly-${{ steps.version.outputs.version }}
          path: packages/agent-core/dist
