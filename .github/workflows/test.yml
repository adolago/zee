name: test

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Audit (high)
        run: bash scripts/bun-audit-ci.sh

      - name: Typecheck
        run: bun run --cwd packages/agent-core typecheck

      - name: Test
        run: bun run --cwd packages/agent-core test
        env:
          CI: true
        timeout-minutes: 10

  test_zee:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      # Corepack has intermittently failed to verify pnpm signatures on GitHub
      # runners ("Cannot find matching keyid"). Installing pnpm directly avoids
      # that failure mode.
      - name: Install pnpm
        run: npm install -g pnpm@10.23.0

      - name: Install dependencies
        # Zee does not commit a pnpm lockfile, so CI must allow generating one.
        run: pnpm install --no-frozen-lockfile
        working-directory: packages/personas/zee

      - name: Test
        run: pnpm test
        working-directory: packages/personas/zee
        env:
          CI: true
        timeout-minutes: 20
