name: test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  secrets:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Audit (high)
        run: bash scripts/bun-audit-ci.sh

      - name: Validate SKILL metadata
        run: bash scripts/verify-skills.sh

      - name: Typecheck
        run: bun run --cwd packages/zee typecheck

      - name: Test
        run: bun run --cwd packages/zee test
        env:
          CI: true
        timeout-minutes: 10

  test_zee:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        run: npm install -g pnpm@10.23.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: packages/zee/Swabble

      - name: Test
        run: pnpm test
        working-directory: packages/zee/Swabble
        env:
          CI: true
        timeout-minutes: 20
