[workspace]
resolver = "3"
members = [
    "packages/stanley-core",
    "packages/zee-gui",
    "packages/zee-gui/crates/zee-editor",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Adolago"]
license = "MIT"
repository = "https://github.com/adolago/zee"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Testing
tempfile = "3.14"

# Directories
directories = "6.0"

# GPUI (Zed's UI framework)
gpui = { git = "https://github.com/zed-industries/zed", rev = "94faaebfec5e46afa6d3aee5372cbbdb33b97c33", default-features = false, features = ["wayland", "font-kit"] }

# HTTP & networking
reqwest = { version = "0.13", features = ["json", "blocking"] }
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
futures-util = "0.3"
url = "2.5"

# Logging
log = "0.4"

# Text processing
regex = "1.12"
