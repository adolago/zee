[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "investing"
version = "0.1.1a0"
description = "Investment analysis platform - Money flow, macro, commodities, fundamentals with FastAPI backend and Rust GUI"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "AGPL-3.0-only"}
authors = [
    {name = "Investing Development Team", email = "contact@investing.com"}
]
keywords = ["finance", "investment", "institutional", "money-flow", "analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.21.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=0.991",
]

# Trading and backtesting
nautilus = [
    "nautilus_trader>=1.180.0",
]

# Market data
openbb = [
    "openbb>=4.0.0",
]

# Portfolio optimization
portfolio = [
    "riskfolio-lib>=6.0.0",
    "skfolio>=0.3.0",
]

# Factor analysis and performance
quant = [
    "alphalens-reloaded>=0.4.5",
    "pyfolio-reloaded>=0.9.5",
    "empyrical-reloaded>=0.5.10",
]

# Sentiment and NLP
sentiment = [
    "finbert-embedding>=0.1.0",
    "transformers>=4.30.0",
]

# Reinforcement learning
rl = [
    "finrl>=0.3.6",
    "stable-baselines3>=2.0.0",
]

# SEC filings
sec = [
    "edgartools>=2.30.0",
    "edgar-crawler>=0.1.0",
]

# Macro data
macro = [
    "dbnomics>=1.2.0",
    "fredapi>=0.5.0",
]

# Options pricing and Greeks
options = [
    "py_vollib>=1.0.1",
    "py_vollib_vectorized>=0.1.1",
    "mibian>=0.1.3",
    "scipy>=1.10.0",
]

# All optional dependencies
all = [
    "investing[nautilus,openbb,portfolio,quant,sentiment,sec,macro,options]",
]

[project.urls]
Homepage = "https://github.com/your-username/investing"
Repository = "https://github.com/your-username/investing"
Issues = "https://github.com/your-username/investing/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["investing*"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true